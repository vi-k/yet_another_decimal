name: example
description: Example for denary.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  ansi_escape_codes: ^4.0.1
  benchmark_harness: ^2.3.1
  big_decimal: ^0.7.0
  big_double: ^1.0.2
  decimal: ^3.2.6
  decimal_type: ^0.0.3
  denary:
    path: ..
  # The caret spans both versions on purpose: on the 3.6 floor pub takes 6.1.1,
  # on a current SDK it takes 6.2.0. Do not pin 6.2.0 — it would cost the floor
  # and buy nothing. 6.2.0 differs from 6.1.1 by the version string in
  # version.g.dart and by nothing else; what it does bring is intl ^0.20.3, and
  # intl 0.20.3 wants Dart ^3.9.0.
  fixed: ^6.1.1
  format: ^4.1.0
  precise_decimal: ^0.0.1

dev_dependencies:
  # 6.x wants Dart 3.8; the floor here is 3.6, so both have to fit.
  lints: '>=5.1.1 <7.0.0'
  test: ^1.24.0
