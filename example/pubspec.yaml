name: example
description: Example for yet_another_decimal.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  ansi_escape_codes: ^4.0.1
  benchmark_harness: ^2.3.1
  big_decimal: ^0.7.0
  big_double: ^1.0.2
  decimal: ^3.2.6
  decimal_type: ^0.0.3
  # 6.2.0 wants a newer SDK than the floor here; on a current one pub still
  # picks it.
  fixed: ^6.1.1
  format: ^4.1.0
  precise_decimal: ^0.0.1
  yet_another_decimal:
    path: ..

dev_dependencies:
  # 6.x wants Dart 3.8; the floor here is 3.6, so both have to fit.
  lints: '>=5.1.1 <7.0.0'
  test: ^1.24.0
