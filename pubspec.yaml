name: denary
description: Decimal numbers with a fixed point and no loss of precision. Two independent families - one on BigInt with no bounds on magnitude, one on int for speed.
version: 1.2.0
homepage: https://github.com/vi-k/denary
repository: https://github.com/vi-k/denary
issue_tracker: https://github.com/vi-k/denary/issues

topics:
 - decimal
 - fixed-point
 - bigint
 - math
 - precision

environment:
  sdk: ^3.6.0

dependencies:
  meta: ^1.15.0

dev_dependencies:
  # Reference implementation the test suite cross-checks against.
  decimal: ^3.2.6
  lints: '>=5.1.1 <7.0.0'
  test: ^1.26.3
