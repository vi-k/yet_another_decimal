name: yet_another_decimal
description: Yet another package for working with decimals without loss of precision, including two versions - one for large numbers, based on BigInt, and a fast version, based on int.
version: 1.2.0
homepage: https://github.com/vi-k/yet_another_decimal
repository: https://github.com/vi-k/yet_another_decimal
issue_tracker: https://github.com/vi-k/yet_another_decimal/issues

topics:
 - decimal
 - fixed-point
 - bigint
 - math
 - precision

environment:
  sdk: ^3.6.0

dependencies:
  meta: ^1.15.0

dev_dependencies:
  # Reference implementation the test suite cross-checks against.
  decimal: ^3.2.6
  lints: '>=5.1.1 <7.0.0'
  test: ^1.26.3
