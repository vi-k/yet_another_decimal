name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The SDK floor is a promise, not a line in pubspec.yaml: everything runs on
  # 3.6.0 as well as on the current stable.
  test:
    name: Dart ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.6.0', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Test
        run: dart test

  # The bench is a package of its own, with its own analysis options and its
  # own dependencies — and it is what the numbers in README come from.
  example:
    name: Bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'

      - name: Dependencies
        run: dart pub get
        working-directory: example

      - name: Analyze
        run: dart analyze --fatal-infos
        working-directory: example

      - name: Format
        run: dart format --output=none --set-exit-if-changed .
        working-directory: example

      - name: Tour
        run: dart run example.dart
        working-directory: example
